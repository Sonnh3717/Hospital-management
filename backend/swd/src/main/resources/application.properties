spring.application.name=swd
server.port=${SERVER_PORT:8081}

# Supply connection settings through environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create missing tables and columns from the backend entities without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Preserve DATE/TIME/DATETIME java.time values without JVM-zone conversion through java.sql types.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
server.error.include-message=never
server.error.include-stacktrace=never
